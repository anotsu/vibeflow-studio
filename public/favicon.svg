<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 256 256" width="256" height="256">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0b0f19" />
      <stop offset="50%" stop-color="#0f172a" />
      <stop offset="100%" stop-color="#020617" />
    </linearGradient>

    <!-- Border Glow -->
    <linearGradient id="borderGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#8b5cf6" stop-opacity="0.8" />
      <stop offset="50%" stop-color="#06b6d4" stop-opacity="0.5" />
      <stop offset="100%" stop-color="#3b82f6" stop-opacity="0.3" />
    </linearGradient>

    <!-- Stream A (Violet - Creative/Agent A) -->
    <linearGradient id="streamViolet" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#c084fc" />
      <stop offset="40%" stop-color="#8b5cf6" />
      <stop offset="100%" stop-color="#6366f1" />
    </linearGradient>

    <!-- Stream B (Cyan - Systematic/Agent B) -->
    <linearGradient id="streamCyan" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#22d3ee" />
      <stop offset="50%" stop-color="#06b6d4" />
      <stop offset="100%" stop-color="#3b82f6" />
    </linearGradient>

    <!-- Nexus Spark (Gold/Amber) -->
    <radialGradient id="sparkGrad" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#fbbf24" stop-opacity="1" />
      <stop offset="60%" stop-color="#f59e0b" stop-opacity="0.8" />
      <stop offset="100%" stop-color="#f59e0b" stop-opacity="0" />
    </radialGradient>

    <!-- Glow Filter -->
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>

    <filter id="softGlow" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="14" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Container Squircle -->
  <rect x="8" y="8" width="240" height="240" rx="54" fill="url(#bgGrad)" stroke="url(#borderGrad)" stroke-width="3" />

  <!-- Ambient Backdrop Glows -->
  <circle cx="80" cy="90" r="45" fill="#8b5cf6" opacity="0.25" filter="url(#softGlow)" />
  <circle cx="176" cy="90" r="45" fill="#06b6d4" opacity="0.25" filter="url(#softGlow)" />
  <circle cx="128" cy="180" r="35" fill="#3b82f6" opacity="0.3" filter="url(#softGlow)" />

  <!-- Left Stream: Left branch of V flowing downwards and curling into infinity nexus -->
  <path
    d="M 68 64
       C 78 64, 88 80, 96 112
       L 116 172
       C 122 190, 134 190, 140 172
       L 156 124
       C 160 112, 168 108, 176 116
       C 184 124, 180 136, 172 152
       L 148 196
       C 138 214, 118 214, 108 196
       L 60 76
       C 56 68, 60 64, 68 64 Z"
    fill="url(#streamViolet)"
    filter="url(#glow)"
  />

  <!-- Right Stream: Right branch of V sweeping downwards and crossing smoothly -->
  <path
    d="M 188 64
       C 178 64, 168 80, 160 112
       L 142 166
       C 138 178, 128 178, 124 166
       L 104 118
       C 100 108, 92 108, 86 116
       C 80 124, 84 136, 92 152
       L 114 192
       C 122 206, 134 206, 142 192
       L 196 76
       C 200 68, 196 64, 188 64 Z"
    fill="url(#streamCyan)"
    filter="url(#glow)"
  />

  <!-- High-Energy Intersecting V-Apex Arc -->
  <path
    d="M 80 72
       C 100 120, 120 185, 128 195
       C 136 185, 156 120, 176 72"
    fill="none"
    stroke="#ffffff"
    stroke-width="5"
    stroke-linecap="round"
    stroke-dasharray="1 8"
    opacity="0.6"
  />

  <!-- Central Nexus Energy Core (Dual-Agent Synthesis Spark) -->
  <circle cx="128" cy="180" r="18" fill="url(#sparkGrad)" filter="url(#glow)" />
  <circle cx="128" cy="180" r="6" fill="#ffffff" opacity="0.9" />

  <!-- Top Energy Nodes -->
  <circle cx="70" cy="72" r="5" fill="#e9d5ff" filter="url(#glow)" />
  <circle cx="186" cy="72" r="5" fill="#a5f3fc" filter="url(#glow)" />
</svg>
